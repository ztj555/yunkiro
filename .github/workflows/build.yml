name: Build Artifacts

# 构建 relay.exe (Windows x64)、PC 端安装包 (Windows) 和 Android APK
# 触发：推送到任意分支、PR、或手动触发
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------------
  # Relay 服务端 (Go) -> Windows x64 单二进制 relay.exe
  # ----------------------------------------------------------------
  relay:
    name: Build relay.exe (Windows x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"
          cache-dependency-path: relay/go.sum

      - name: Run tests
        working-directory: relay
        run: go test ./...

      - name: Cross-compile for Windows x64
        working-directory: relay
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o relay.exe ./cmd/relay

      - name: Upload relay.exe
        uses: actions/upload-artifact@v4
        with:
          name: relay-windows-x64
          path: relay/relay.exe
          if-no-files-found: error

  # ----------------------------------------------------------------
  # PC 端 (Tauri v2 + React/TS) -> Windows 安装包 (.exe / .msi)
  # ----------------------------------------------------------------
  pc:
    name: Build PC client (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: pc/src-tauri -> target

      - name: Install npm dependencies
        working-directory: pc
        run: npm install

      - name: Build Tauri app
        working-directory: pc
        run: npm run tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: pc-windows-installer
          path: |
            pc/src-tauri/target/release/bundle/nsis/*.exe
            pc/src-tauri/target/release/bundle/msi/*.msi
            pc/src-tauri/target/release/yunkiro-pc.exe
          if-no-files-found: warn

  # ----------------------------------------------------------------
  # Android 端 (Kotlin) -> Debug APK (可直接安装)
  # ----------------------------------------------------------------
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # ----------------------------------------------------------------
  # 浏览器扩展 (TS MV3) -> 打包 dist 目录 (附带, 方便加载)
  # ----------------------------------------------------------------
  extension:
    name: Build browser extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: extension
        run: npm install

      - name: Run tests
        working-directory: extension
        run: npm test

      - name: Build extension
        working-directory: extension
        run: npm run build

      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: browser-extension
          path: extension/dist/**
          if-no-files-found: error
